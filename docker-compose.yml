services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unilink
      POSTGRES_USER: unilink
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - unilink-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unilink -d unilink"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  unilink-postgres: